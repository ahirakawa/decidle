<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  /* The shimen look of the Home page (src/home/page.html), its colors and its report beside the
     list. The page is for reading at length, so it always takes this look. */
  :root { --jp: "Hiragino Sans", "Yu Gothic UI", sans-serif; --min: "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ink: #14130f; --paper: #fffdf6; --ac: #1f3fff; --bg: #efe9dc; --fg: #14130f; --warn: #ff6a1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--jp); }
  main { max-width: 900px; margin: 28px auto 64px; padding: 22px 28px 28px; background: var(--paper); color: var(--ink); font-size: 14.5px; line-height: 1.7; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ac); }
  @media (max-width: 960px) { main { margin: 16px 18px 48px; } }
  header { font: 700 11px var(--jp); opacity: .6; overflow-wrap: anywhere; }
  h1 { font: 900 24px/1.3 var(--min); margin: 2px 0 6px; }
  .goal { font-size: 12.5px; opacity: .75; margin: 0 0 12px; }
  .goal::before { content: "目的: "; }
  .conclusion { font-weight: 700; font-size: 16px; margin: 0; }
  h2 { font: 900 12px var(--jp); letter-spacing: .1em; margin: 24px 0 8px; padding-bottom: 2px; border-bottom: 3px solid var(--ink); display: inline-block; }
  .none { opacity: .6; margin: 0; }
  .decision { margin: 0 0 16px; }
  .decision h3 { font-size: 15px; font-weight: 900; margin: 6px 0 4px; line-height: 1.5; }
  .option { border: 2px solid var(--ink); padding: 6px 10px; margin: 6px 0; }
  .option.recommended { background: var(--ink); color: var(--paper); }
  .option .label { font-weight: 700; }
  .badge { display: inline-block; margin-left: 8px; padding: 0 7px; font-size: 10.5px; font-weight: 900; background: var(--ac); color: #fff; }
  .option .effect { font-size: 13.5px; }
  .reason { font-size: 12.5px; opacity: .85; margin: 4px 0 0; }
  .reason::before { content: "理由: "; }
  .warn { border: 3px solid var(--warn); padding: 10px 14px; margin: 10px 0 16px; font-size: 13.5px; font-weight: 700; }
  .warn ul { margin: 4px 0 0; padding-left: 1.2em; font-weight: 400; }
  .folded { margin-top: 24px; }
  details { border-top: 3px solid var(--ink); padding: 8px 0; }
  details:last-of-type { border-bottom: 3px solid var(--ink); }
  summary { cursor: pointer; font: 900 12px var(--jp); letter-spacing: .1em; }
  summary .count { opacity: .6; margin-left: 6px; letter-spacing: 0; }
  details ul { margin: 8px 0 4px; padding-left: 1.2em; }
  details li { margin-bottom: 5px; }
  code, .path { font: 600 12px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  .file { margin: 10px 0 14px; }
  .file .summary { font-size: 13.5px; }
  .change { font-size: 12px; opacity: .85; margin: 4px 0 0; padding-left: 10px; border-left: 3px solid currentColor; }
  .change .k { opacity: .65; display: inline-block; min-width: 4.5em; }
</style>
</head>
<body>
<main>
<header>{{meta}}</header>
<h1>{{title}}</h1>
{{warnings}}
<p class="goal">{{goal}}</p>
<p class="conclusion">{{conclusion}}</p>
<h2>決めてほしいこと</h2>
{{decisions}}
<div class="folded">
{{details}}
</div>
</main>
</body>
</html>
