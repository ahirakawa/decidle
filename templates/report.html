<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --bg: #f5f9f4; --fg: #1b2a1f; --muted: #58695c; --line: #d2dfd3;
    --card: #ffffff; --accent: #1d7443; --accent-bg: #e2f2e7; --warn: #8a4b00; --warn-bg: #fbf1df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111a14; --fg: #e2ede4; --muted: #93a697; --line: #2b3a2f;
      --card: #19241c; --accent: #72d394; --accent-bg: #1c3626; --warn: #ffc27d; --warn-bg: #3a2c17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.75 "Sarasa Fixed J", "Sarasa Fixed", ui-monospace, "SF Mono", Menlo, monospace;
  }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
  header { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .goal { color: var(--muted); margin: 0 0 10px; }
  .goal::before { content: "やろうとしていたこと: "; }
  .conclusion { font-size: 19px; line-height: 1.7; margin: 0 0 28px; padding-left: 14px; border-left: 4px solid var(--accent); }
  h2 { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 10px; letter-spacing: .04em; }
  .none { color: var(--muted); margin: 0 0 28px; }
  .decision { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px; }
  .decision h3 { font-size: 17px; margin: 0 0 12px; line-height: 1.5; }
  .option { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
  .option.recommended { border-color: var(--accent); background: var(--accent-bg); }
  .option .label { font-weight: 600; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; margin-left: 8px; line-height: 1.6; }
  .option .effect { color: var(--muted); font-size: 14px; }
  .reason { font-size: 14px; margin: 10px 0 0; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin: 0 0 20px; font-size: 14px; }
  .warn ul { margin: 4px 0 0; padding-left: 20px; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  summary .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
  details ul { margin: 8px 0 4px; padding-left: 22px; }
  details li { margin: 4px 0; }
  .folded { margin-top: 28px; }
  code, .path { font-size: 14px; overflow-wrap: anywhere; color: var(--accent); }
  .file { margin: 10px 0 14px; }
  .file .summary { font-size: 14px; }
  .change { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin: 8px 0; font-size: 14px; }
  .change .k { color: var(--muted); display: inline-block; min-width: 4.5em; }
</style>
</head>
<body>
<main>
<header>{{meta}}</header>
<h1>{{title}}</h1>
{{warnings}}
<p class="goal">{{goal}}</p>
<p class="conclusion">{{conclusion}}</p>
<h2>決めてほしいこと</h2>
{{decisions}}
<div class="folded">
{{details}}
</div>
</main>
</body>
</html>
